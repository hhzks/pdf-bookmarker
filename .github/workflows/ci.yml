name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # Two runners because the suite has OS-gated tests in both directions and
    # neither one alone covers it: Linux runs OCR and skips
    # test_webapp_jobs.py's file-locking test (skipif os.name != "nt"),
    # Windows does the reverse. fail-fast off so one OS failing still reports
    # the other.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Matches backend/Dockerfile; PyMuPDF needs this to find the language
      # data. Meaningless on the Windows runner, which installs no Tesseract.
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # OCR shells out to the tesseract binary, so there is no Python
      # dependency to pin and no ImportError to notice: without this the
      # suite still passes and simply skips the one test that runs real OCR.
      # Linux only -- Windows is here for the file-locking test, and letting
      # OCR skip there keeps that runner cheap.
      - name: Install Tesseract
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Install the package
        run: pip install -e ".[dev]"

      # The Linux runner is the only place the real Tesseract call is
      # exercised, so a skip there is a failure, not a pass. pytest exits 0 on
      # a skip; assert the test actually ran.
      - name: Verify the real OCR test is not skipped
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          python -m pytest tests/test_ocr.py::test_extract_lines_via_ocr_recovers_text -q -rs | tee ocr.log
          grep -q "1 passed" ocr.log

      # -rs so the skip list is in the log. Both runners report the same
      # totals (438 passed / 3 skipped) while skipping different tests, so
      # without the reasons printed the two look identical and neither's
      # coverage gap is visible.
      - name: Run the test suite
        run: python -m pytest -rs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `build` runs tsc --noEmit before vite build, so this is the typecheck too.
      - name: Typecheck and build
        run: npm run build
