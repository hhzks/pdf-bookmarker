services:
  - type: web
    name: pdf-bookmarker-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: VERIFICATION_MODEL
        sync: false   # optional; unset means no server-side LLM
      - key: OCR_MAX_PAGES
        sync: false   # optional; defaults to 50
